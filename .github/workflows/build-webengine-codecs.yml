name: Qt WebEngine with H.264 and AAC

# Builds the codec-enabled Qt WebEngine that Merlin's installers fetch, on
# GitHub's own machines, so nobody compiles Chromium on their own computer.
#
# GitHub stops any one job after six hours, and the second run was stopped
# there, still compiling. So the build is split into parts: each compiles for
# a fixed time, saves the source and build folders, and the next part carries
# on where it stopped (.github/actions/codec-build-part). The part that
# finishes hands the engine on; the parts after it exit in a minute.
#
# It builds exactly the Qt and Qt WebEngine versions pip installs for Merlin
# right now, checks the result really plays H.264 and AAC on Windows, and only
# then publishes it as a release tagged engine-<version>. Installers of that
# version, and Merlin's own updater, fetch it from there automatically.
#
# Runs by itself once a week and does nothing unless PyQt6 has moved to a
# version with no published engine yet. Can also be started by hand from the
# Actions tab, or by pushing a tag named engine-<version>.
#
# Several steps exist because of problems found building Qt WebEngine on
# these runners (credited to danxdigitalsolution-stack/web-engine, whose public
# workflow found them first): the runner image, the Windows SDK, the CMake
# version, html5lib, flex and bison, and retries when cloning from code.qt.io.
#
# Publishing binaries that contain H.264 and AAC carries patent licensing
# obligations. That is a decision for whoever runs this.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if this version is already published"
        type: boolean
        default: false
  push:
    tags: ["engine-*"]

permissions:
  contents: write

jobs:
  plan:
    # windows-latest is windows-2025, whose image claims Windows SDK 26100
    # but falls back to an ancient one (actions/runner-images#13310); every
    # job here uses windows-2022, and the same image throughout.
    runs-on: windows-2022
    outputs:
      qt: ${{ steps.versions.outputs.qt }}
      web: ${{ steps.versions.outputs.web }}
      skip: ${{ steps.published.outputs.skip }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Which versions Merlin gets from pip today
        id: versions
        shell: pwsh
        run: |
          python -m pip install PyQt6 PyQt6-WebEngine
          # the running versions, not what PyQt6 was compiled against: the
          # engine is tied to its exact Qt through private interfaces
          $qt  = python -c "from PyQt6.QtCore import qVersion; print(qVersion())"
          $web = python -c "from PyQt6.QtWebEngineCore import qWebEngineVersion; print(qWebEngineVersion())"
          Write-Host "Qt $qt, Qt WebEngine $web"
          "qt=$qt"   | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "web=$web" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Already published?
        id: published
        shell: pwsh
        run: |
          gh release view "engine-${{ steps.versions.outputs.web }}" --repo "$env:GITHUB_REPOSITORY" *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $force = "${{ github.event.inputs.force }}" -eq "true"
          if ($exists -and -not $force) {
            Write-Host "engine-${{ steps.versions.outputs.web }} is already published. Nothing to do."
            "skip=true" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "skip=false" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          $global:LASTEXITCODE = 0

  part1:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: windows-2022
    timeout-minutes: 355
    outputs:
      done: ${{ steps.part.outputs.done }}
    steps:
      - uses: actions/checkout@v4
      - id: part
        uses: ./.github/actions/codec-build-part
        with:
          part: "1"
          previous-done: "false"
          qt-version: ${{ needs.plan.outputs.qt }}
          web-version: ${{ needs.plan.outputs.web }}

  part2:
    needs: [plan, part1]
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' && needs.part1.result == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 355
    outputs:
      done: ${{ steps.part.outputs.done }}
    steps:
      - uses: actions/checkout@v4
      - id: part
        uses: ./.github/actions/codec-build-part
        with:
          part: "2"
          previous-done: ${{ needs.part1.outputs.done }}
          qt-version: ${{ needs.plan.outputs.qt }}
          web-version: ${{ needs.plan.outputs.web }}

  part3:
    needs: [plan, part2]
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' && needs.part2.result == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 355
    outputs:
      done: ${{ steps.part.outputs.done }}
    steps:
      - uses: actions/checkout@v4
      - id: part
        uses: ./.github/actions/codec-build-part
        with:
          part: "3"
          previous-done: ${{ needs.part2.outputs.done }}
          qt-version: ${{ needs.plan.outputs.qt }}
          web-version: ${{ needs.plan.outputs.web }}

  part4:
    needs: [plan, part3]
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' && needs.part3.result == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 355
    outputs:
      done: ${{ steps.part.outputs.done }}
    steps:
      - uses: actions/checkout@v4
      - id: part
        uses: ./.github/actions/codec-build-part
        with:
          part: "4"
          previous-done: ${{ needs.part3.outputs.done }}
          qt-version: ${{ needs.plan.outputs.qt }}
          web-version: ${{ needs.plan.outputs.web }}

  part5:
    needs: [plan, part4]
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' && needs.part4.result == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 355
    outputs:
      done: ${{ steps.part.outputs.done }}
    steps:
      - uses: actions/checkout@v4
      - id: part
        uses: ./.github/actions/codec-build-part
        with:
          part: "5"
          previous-done: ${{ needs.part4.outputs.done }}
          qt-version: ${{ needs.plan.outputs.qt }}
          web-version: ${{ needs.plan.outputs.web }}

  publish:
    needs: [plan, part5]
    if: ${{ !cancelled() && needs.plan.outputs.skip != 'true' && needs.part5.outputs.done == 'true' }}
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WEB_VERSION: ${{ needs.plan.outputs.web }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: The built engine
        uses: actions/download-artifact@v4
        with:
          name: codec-engine
          path: C:\engine

      - name: Check it really plays H.264 and AAC
        shell: pwsh
        run: |
          # The same check the installers make: swap it into a PyQt6 of the
          # same versions, start it, and ask. Nothing is published unless it
          # passes.
          python -m pip install "PyQt6-Qt6==${{ needs.plan.outputs.qt }}" "PyQt6-WebEngine-Qt6==${{ needs.plan.outputs.web }}" PyQt6 PyQt6-WebEngine
          $env:QT_QPA_PLATFORM = "offscreen"
          python tools\use-codec-engine.py "C:\engine"
          if ($LASTEXITCODE -ne 0) { throw "The build does not play H.264 and AAC" }

      - name: Package and publish
        shell: pwsh
        run: |
          python tools\use-codec-engine.py --package "C:\engine" "$env:GITHUB_WORKSPACE\dist"
          if ($LASTEXITCODE -ne 0) { throw "Packaging failed" }
          $asset = "$env:GITHUB_WORKSPACE\dist\qtwebengine-$env:WEB_VERSION-codecs-windows-x64.zip"
          gh release view "engine-$env:WEB_VERSION" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "engine-$env:WEB_VERSION" $asset "$asset.sha256" --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create "engine-$env:WEB_VERSION" $asset "$asset.sha256" `
              --repo "$env:GITHUB_REPOSITORY" `
              --title "Qt WebEngine $env:WEB_VERSION with H.264 and AAC" `
              --notes "Built by GitHub Actions and checked to play H.264 and AAC before publishing. Merlin's installers fetch this automatically for Qt WebEngine $env:WEB_VERSION."
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing failed" }
